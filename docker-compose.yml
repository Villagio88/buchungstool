# Betrieb mit Docker. Die Seite lauscht auf Port 3000; davor gehört ein Reverse
# Proxy mit HTTPS (Caddy, Traefik, nginx), siehe README.
#
# Fertiges Abbild von GitHub statt selbst bauen:
#   image: ghcr.io/villagio88/buchungstool:latest  (und «build: .» entfernen)
services:
  buchung:
    build: .
    image: buchungstool:latest
    container_name: buchungstool
    restart: unless-stopped
    env_file:
      - buchung.env
    volumes:
      - buchung_data:/data
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  buchung_data:
