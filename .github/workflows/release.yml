name: Release

# Ein Tag wie v0.2.0 baut das Abbild und legt es in der GitHub Container
# Registry ab: ghcr.io/<konto>/buchungstool:<version> und :latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  abbild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Erst prüfen, dann veröffentlichen.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run sicherheit
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            # latest nur für fertige Versionen, nicht für v1.0.0-rc.1 und ähnliche
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
