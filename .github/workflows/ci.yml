name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run sicherheit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: pruefen
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Abbild bauen und starten
        run: |
          docker build -t buchungstool:ci .
          docker run -d --name bt -e BEREICHE=test -e BEREICH_TEST_MAIL=test@example.com -p 3000:3000 buchungstool:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/gesund && exit 0; sleep 2; done
          docker logs bt; exit 1
