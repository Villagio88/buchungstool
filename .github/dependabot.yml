version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      abhaengigkeiten:
        patterns: ["*"]
        update-types: [minor, patch]
    # Grosse Versionssprünge bewusst von Hand, nicht als Flut von Vorschlägen.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Keine Sprünge auf eine neue Node-Hauptversion ohne Absicht; der Wechsel auf
    # die nächste LTS-Fassung geschieht von Hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
