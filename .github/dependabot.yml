version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      abhaengigkeiten:
        patterns: ["*"]
        update-types: [minor, patch]
    # Grosse Versionssprünge bewusst von Hand, nicht als Flut von Vorschlägen.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Nur Node-LTS (gerade Hauptversionen) und keinen Sprung ohne Absicht.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
